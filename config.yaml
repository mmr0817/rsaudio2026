project:
  name: speaker_quality_classifier
  seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_rate: 16000
  max_duration: 2.5
  labels:
  - good
  - bad
  label_map:
    good: 0
    bad: 1
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
model:
  backbone: null
  num_labels: 2
  freeze_feature_encoder: true
  freeze_base_model: false
  pooling: mean
  dropout: 0.1
  hidden_size: 256
training:
  output_dir: outputs/models
  log_dir: outputs/logs
  num_epochs: 200
  batch_size: 64
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: true
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: f1
  greater_is_better: true
  early_stopping_patience: 5
  num_workers: 4
inference:
  model_path: outputs/models/best
  device: auto
  threshold_critical: 0.4
